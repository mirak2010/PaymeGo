<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payme QR Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: linear-gradient(to right, #f7f8fc, #e3e6f0);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 25px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .logo { width: 120px; height: auto; }

        h2 { margin: 0 0 15px; color: #333; font-size: 1.4rem; }

        .lang-switch {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .lang-switch button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ddd;
            background: #f8f9fa;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .lang-switch button.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        #reader {
            width: 100%;
            margin: 15px 0;
            border-radius: 10px;
            overflow: hidden;
            background: #fafafa;
        }

        button.action-btn { background: #00b2ff; color: white; width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button.pay-btn { background: #28a745; color: white; width: 100%; padding: 14px; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; font-size: 1.1rem; }

        .preferred-amounts { margin: 10px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        .preferred-amounts button { background: #f0f0f0; border: 1px solid #ccc; padding: 8px 12px; border-radius: 8px; cursor: pointer; }

        #status { margin-top: 15px; font-size: 14px; color: #555; font-weight: 500; }

        body.fade-out { animation: fadeOut 1s forwards; }
        @keyframes fadeOut { to { opacity: 0; transform: scale(0.98); } }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="static/coffeewaylogo.png" alt="Coffee Way" class="logo">
        <img src="static/paymelogo.png" alt="Payme" class="logo">
    </div>

    <h2 id="title">Scan Payme GO QR</h2>

    <div class="lang-switch">
        <button id="btn-uz" onclick="setLanguage('uz')">🇺🇿 O'zbek</button>
        <button id="btn-ru" onclick="setLanguage('ru')">🇷🇺 Русский</button>
    </div>

    <form id="payment-form" onsubmit="event.preventDefault();">
        <input type="number" id="amount" placeholder="Amount (UZS)" required>
        
        <div class="preferred-amounts">
            <button type="button" onclick="setPreferredAmount(23000)">23000</button>
            <button type="button" onclick="setPreferredAmount(28000)">28000</button>
            <button type="button" onclick="setPreferredAmount(33000)">33000</button>
            <button type="button" onclick="setPreferredAmount(38000)">38000</button>
        </div>

        <input type="text" id="desc" placeholder="Description">
        <input type="text" id="gun-scanner-input" placeholder="QR Token Result">
        
        <div id="reader"></div>

        <button type="button" class="pay-btn" onclick="handlePayment()" id="pay-btn">Pay</button>
        <button type="button" class="action-btn" onclick="startCamera()" id="start-btn">Start Camera</button>

        <p id="status">Click "Start Camera" to begin scanning.</p>
    </form>
</div>

<script>
    let html5QrCode = null;
    let isCameraRunning = false;
    let scanLocked = false;
    let currentLang = 'uz';

    const translations = {
        uz: {
            title: "Payme GO QR kodini skanerlash",
            amount: "Summani kiriting (UZS)",
            desc: "Izoh",
            gunScanner: "Skaner natijasi",
            start: "Kamerani yoqish",
            pay: "To‘lash",
            clickToStart: "📷 QR kodni skanerlash uchun 'Kamerani yoqish' tugmasini bosing.",
            alreadyRunning: "⚠️ Kamera allaqachon ishlayapti.",
            noCamera: "❌ Kamera topilmadi.",
            processing: "⏳ To'lov amalga oshirilmoqda...",
            success: "✅ To'lov muvaffaqiyatli yakunlandi!",
            failed: "❌ To'lov amalga oshmadi",
            enterAmount: "❌ Iltimos, summani kiriting.",
            noToken: "❌ QR token topilmadi.",
            networkError: "❌ Tarmoq xatosi",
            scannedReady: "✅ QR kod skanerlandi. Endi 'To‘lash' tugmasini bosing."
        },
        ru: {
            title: "Сканируйте QR Payme GO",
            amount: "Введите сумму (UZS)",
            desc: "Описание",
            gunScanner: "Результат сканера",
            start: "Запустить камеру",
            pay: "Оплатить",
            clickToStart: "📷 Нажмите 'Запустить камеру' для сканирования QR-кода.",
            alreadyRunning: "⚠️ Камера уже активна.",
            noCamera: "❌ Камеры не найдены.",
            processing: "⏳ Обработка платежа...",
            success: "✅ Платеж прошел успешно!",
            failed: "❌ Платеж не выполнен",
            enterAmount: "❌ Пожалуйста, введите сумму.",
            noToken: "❌ QR токен не найден.",
            networkError: "❌ Ошибка сети",
            scannedReady: "✅ QR-код отсканирован. Теперь нажмите кнопку 'Оплатить'."
        }
    };

    function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.getElementById('title').innerText = t.title;
        document.getElementById('amount').placeholder = t.amount;
        document.getElementById('desc').placeholder = t.desc;
        document.getElementById('gun-scanner-input').placeholder = t.gunScanner;
        document.getElementById('start-btn').innerText = t.start;
        document.getElementById('pay-btn').innerText = t.pay;
        document.getElementById('status').innerText = t.clickToStart;
        document.getElementById('btn-uz').classList.toggle('active', lang === 'uz');
        document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
    }

    function startCamera() {
        const t = translations[currentLang];
        const status = document.getElementById('status');

        if (isCameraRunning) {
            status.innerText = t.alreadyRunning;
            return;
        }

        html5QrCode = new Html5Qrcode("reader");

        Html5Qrcode.getCameras().then(devices => {
            if (!devices || devices.length === 0) {
                status.innerText = t.noCamera;
                return;
            }

            // Prefer back camera
            const cameraId = devices.length > 1 ? devices[1].id : devices[0].id;

            html5QrCode.start(
                cameraId,
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    if (scanLocked) return;
                    scanLocked = true;

                    document.getElementById("gun-scanner-input").value = decodedText;
                    status.innerText = t.scannedReady;

                    html5QrCode.stop().then(() => {
                        isCameraRunning = false;
                    }).catch(err => console.error(err));
                }
            ).then(() => {
                isCameraRunning = true;
                scanLocked = false;
            }).catch(err => {
                status.innerText = `${t.networkError}: ${err}`;
            });
        });
    }

    function handlePayment() {
        const t = translations[currentLang];
        const amount = document.getElementById("amount").value.trim();
        const desc = document.getElementById("desc").value.trim();
        const token = document.getElementById("gun-scanner-input").value.trim();

        if (!amount) {
            document.getElementById("status").innerText = t.enterAmount;
            return;
        }
        if (!token) {
            document.getElementById("status").innerText = t.noToken;
            return;
        }

        document.getElementById("status").innerText = t.processing;

        fetch("/pay", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, amount, description: desc })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                document.getElementById("status").innerText = t.success;
                setTimeout(() => {
                    document.body.classList.add("fade-out");
                    setTimeout(() => { location.reload(); }, 1000);
                }, 1500);
            } else {
                scanLocked = false;
                document.getElementById("status").innerText = `${t.failed}: ${data.message || "Error"}`;
            }
        })
        .catch(err => {
            scanLocked = false;
            document.getElementById("status").innerText = `${t.networkError}: ${err.message}`;
        });
    }

    function setPreferredAmount(value) {
        document.getElementById('amount').value = value;
    }

    // Handle Gun Scanner physical enter key
    document.getElementById('gun-scanner-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            handlePayment();
        }
    });

    setLanguage('uz');
</script>

</body>
</html>
